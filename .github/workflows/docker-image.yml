name: Build and Push to GHCR

# 1. 触发条件：定义什么情况下运行这个工作流
on:
  push:
    branches: [ "master" ]    # 当推送到 main 分支时触发（如果是 master 分支请修改此处）

# 2. 定义作业（Jobs）
jobs:
  build-and-push:
    # 运行环境：使用最新版本的 Ubuntu 虚拟机
    runs-on: ubuntu-latest

    # 3. 权限设置：明确声明此作业需要的权限
    permissions:
      contents: read        # 读取代码仓库内容的权限
      packages: write       # 写入 GitHub Packages (GHCR) 的权限，这是推送镜像所必需的

    steps:
      # 步骤 1: 检出代码
      # 将仓库代码克隆到运行器中，以便后续步骤可以访问 Dockerfile 和源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 设置 Docker Buildx
      # Buildx 是 Docker 的下一代构建工具，支持更高级的功能如多平台构建和更好的缓存
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 3: 登录到 GitHub Container Registry (GHCR)
      # 使用 github.actor 作为用户名，GITHUB_TOKEN 作为密码进行认证
      # GITHUB_TOKEN 是 GitHub 自动提供的临时令牌，无需手动配置 Secret
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 4: 提取元数据（生成 Tags 和 Labels）
      # 这个动作会根据 Git 分支、Tag 或 SHA 自动生成规范的 Docker 镜像标签
      # 例如：如果是 main 分支，可能生成 latest；如果是 tag v1.0，可能生成 1.0, 1, latest 等
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 指定镜像名称格式：ghcr.io/拥有者/仓库名
          images: ghcr.io/${{ github.repository }}
          # 自定义标签生成规则
          tags: |
            type=semver,pattern={{version}}    # 语义化版本，如 1.0.0
            type=semver,pattern={{major}}.{{minor}} # 主次版本，如 1.0
            type=sha                           # Git commit 的短 SHA 值
            type=ref,event=branch              # 分支名，如 main
            # 只有当推送到默认分支（如 main/master）时才生成 latest  【关键】显式生成 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}

      # 步骤 5: 构建并推送 Docker 镜像
      # 这是核心步骤，执行实际的 docker build 和 push 操作
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                  # 构建上下文：当前目录
          push: true                  # 关键：设置为 true，构建成功后自动推送到 GHCR
          tags: ${{ steps.meta.outputs.tags }}   # 使用上一步生成的标签
          labels: ${{ steps.meta.outputs.labels }} # 使用上一步生成的标签
          # 可选：启用缓存以加速后续构建
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
